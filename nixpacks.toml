[phases.setup]
nixPkgs = ["python3", "ffmpeg", "libopus"]

[phases.install]
cmds = ["python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt"]

[phases.build]
cmds = ["pip install --upgrade pip && pip install -r requirements.txt"]

[start]
cmd = "python bot.py"